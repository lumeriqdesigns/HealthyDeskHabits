<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" fill="none">
  <rect width="1200" height="750" fill="#F5F0E6"/>
  <circle cx="600" cy="340" r="180" fill="#E8DFD0"/>
  <circle cx="600" cy="340" r="140" fill="#F7F5F0"/>
  <!-- clock hands -->
  <circle cx="600" cy="340" r="12" fill="#3D3830"/>
  <line x1="600" y1="340" x2="600" y2="230" stroke="#3D3830" stroke-width="8" stroke-linecap="round"/>
  <line x1="600" y1="340" x2="700" y2="380" stroke="#3D3830" stroke-width="6" stroke-linecap="round"/>
  <!-- tick marks -->
  <line x1="600" y1="210" x2="600" y2="230" stroke="#8A8070" stroke-width="4"/>
  <line x1="600" y1="450" x2="600" y2="470" stroke="#8A8070" stroke-width="4"/>
  <line x1="470" y1="340" x2="490" y2="340" stroke="#8A8070" stroke-width="4"/>
  <line x1="710" y1="340" x2="730" y2="340" stroke="#8A8070" stroke-width="4"/>
  <!-- stretch figure abstract -->
  <circle cx="200" cy="420" r="28" fill="#C4B5A0"/>
  <rect x="185" y="450" width="30" height="70" rx="12" fill="#A89070"/>
  <line x1="200" y1="460" x2="150" y2="520" stroke="#C4B5A0" stroke-width="12" stroke-linecap="round"/>
  <line x1="200" y1="460" x2="250" y2="520" stroke="#C4B5A0" stroke-width="12" stroke-linecap="round"/>
  <text x="60" y="700" font-family="Georgia,serif" font-size="28" fill="#5C5346" opacity="0.7">The 10-Minute Fix</text>
</svg>