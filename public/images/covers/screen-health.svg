<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" fill="none">
  <rect width="1200" height="750" fill="#E8EEF6"/>
  <rect x="0" y="0" width="1200" height="750" fill="url(#g)" opacity="0.5"/>
  <defs>
    <radialGradient id="g" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8EEF6"/>
